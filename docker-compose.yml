services:
  postgres:
    image: postgres:16-alpine
    container_name: uni_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uni_secret}
      POSTGRES_DB: ${POSTGRES_DB:-uni_tcms}
    ports:
      - "5437:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uni} -d ${POSTGRES_DB:-uni_tcms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: uni_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uni_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-uni}:${POSTGRES_PASSWORD:-uni_secret}@postgres:5432/${POSTGRES_DB:-uni_tcms}?schema=public
      REDIS_URL: redis://redis:6379

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d

      CORS_ORIGIN: http://103.189.89.128:8093

      PORT: 4000

    ports:
      - "4001:4000"

    volumes:
      - ./backend/uploads:/app/uploads

    # safe-migrate handles adding Space.workspaceId to a database that already
    # has Space rows (a plain `prisma db push` fails on that with a foreign-key
    # violation — see backend/scripts/safe-migrate.ts). seed-if-empty only runs
    # the destructive seed script on a genuinely empty database, so container
    # restarts never wipe real data again.
    command: >
      sh -c "
      npx prisma generate &&
      npx tsx scripts/safe-migrate.ts &&
      npx tsx scripts/seed-if-empty.ts &&
      npm start
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://103.189.89.128:4001/api
        VITE_SOCKET_URL: http://103.189.89.128:4001

    container_name: uni_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "8093:80"

volumes:
  postgres-data: