script: |
  set -e

  PROJECT_DIR="/var/www/universityTaskManagement/University-Task--Collaboration-Management-System"

  echo "======================================"
  echo "University Task Deployment Started"
  echo "======================================"

  cd "$PROJECT_DIR"

  echo "Fetching latest code..."
  git fetch origin

  echo "Resetting production branch..."
  git reset --hard origin/production

  echo "Cleaning repository..."
  git clean -fd

  echo "Stopping old containers..."
  docker compose down || true

  echo "Removing unused images..."
  docker image prune -af

  echo "Building latest images..."
  docker compose build --no-cache

  echo "Starting containers..."
  docker compose up -d

  echo "Waiting for services..."
  sleep 30

  echo "Checking backend status..."
  if ! docker compose ps backend | grep -q "Up"; then
    echo "❌ Backend failed to start"
    docker compose ps
    docker compose logs backend
    exit 1
  fi

  echo "Checking frontend status..."
  docker compose ps

  echo "Testing backend health..."
  curl --fail http://localhost:4001/api/docs > /dev/null

  echo "Backend is responding."

  echo "Backend Logs"
  docker compose logs --tail=50 backend

  echo "Frontend Logs"
  docker compose logs --tail=20 frontend

  echo "======================================"
  echo "Deployment completed successfully!"
  echo "======================================"