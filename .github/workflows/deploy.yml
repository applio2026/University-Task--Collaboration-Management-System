name: Deploy to production (self-hosted Mac)

# Push to `production` → the self-hosted runner ON the Mac runs the deploy
# script, which re-runs tests, snapshots the current release, builds, applies
# the DB schema, restarts, health-checks, and auto-rolls-back on any failure.
#
# The runner polls GitHub over an outbound connection, so nothing new needs to
# be exposed on the router/firewall. See DEPLOYMENT.md for one-time setup.
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false # never interrupt an in-flight deploy

jobs:
  deploy:
    runs-on: [self-hosted, macOS]
    steps:
      - name: Run deploy script on the Mac
        # deploy.sh figures out its own APP_DIR and does git fetch/reset itself,
        # so no actions/checkout is needed (and the live app dir stays canonical).
        run: /Users/amritesh/Documents/GitHub/University-Task--Collaboration-Management-System/scripts/deploy.sh
