concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script_stop: true
          timeout: 30m

          script: |
            set -e

            PROJECT_DIR="/var/www/universityTaskManagement/University-Task--Collaboration-Management-System"

            echo "======================================"
            echo "University Task Deployment Started"
            echo "======================================"

            cd "$PROJECT_DIR"

            echo "Fetching latest code..."
            git fetch origin

            echo "Resetting production branch..."
            git reset --hard origin/production

            echo "Cleaning repository..."
            git clean -fd

            echo "Stopping old containers..."
            docker compose down || true

            echo "Removing dangling images..."
            docker image prune -f

            echo "Building latest images..."
            docker compose build --no-cache

            echo "Starting containers..."
            docker compose up -d

            echo "Waiting 20 seconds for containers..."
            sleep 20

            echo "Checking backend container..."
            if ! docker compose ps backend | grep -q "Up"; then
              echo "Backend failed to start!"
              docker compose ps
              docker compose logs backend
              exit 1
            fi

            echo "Running Prisma DB Push..."
            docker compose exec -T backend \
              npx prisma db push --skip-generate --accept-data-loss

            echo "Running Seed..."
            docker compose exec -T backend npm run seed

            echo "Container Status"
            docker compose ps

            echo "Backend Logs"
            docker compose logs --tail=50 backend

            echo "Frontend Logs"
            docker compose logs --tail=20 frontend

            echo "Deployment completed successfully!"
